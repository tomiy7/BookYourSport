services:
  search-redis:
    image: redis:7
    container_name: search-redis
    ports:
      - "6380:6379"
    networks:
      - backend

  search_api:
    build:
      context: ..
      dockerfile: Search/Dockerfile
    container_name: search_api
    ports:
      - "8081:8080"
    depends_on:
      - search-redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Services__ReservationServiceUrl=http://reservation.api:8080
      - Redis__ConnectionString=search-redis:6379
    networks:
      - backend

networks:
  backend:
    external: true
    name: bookyoursport-network
services:
  payment_db:
    image: postgres:16
    container_name: payment_db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    networks:
      - backend

  payment_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_api
    ports:
      - "8080:8080"
    depends_on:
      - payment_db
    networks:
      - backend

networks:
  backend:
    external: true
    name: bookyoursport-network
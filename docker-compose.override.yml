services:

  reservationdb:
    container_name: reservationdb
    environment:
      POSTGRES_DB: reservationdb
      POSTGRES_USER: reservation_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - reservation_data:/var/lib/postgresql/data
    networks:
      - backend
        
  reservation.api:
    container_name: reservation.api
    depends_on:
      - reservationdb
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Host=reservationdb;Port=5432;Database=reservationdb;Username=reservation_user;Password=${DB_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
    networks:
      - backend

  authdb:
    container_name: authdb
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    restart: always
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - backend
